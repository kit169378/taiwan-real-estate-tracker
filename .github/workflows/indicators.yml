name: 總經與建照使照指標

on:
  schedule:
    - cron: "0 1 5,25 * *"   # 台灣時間每月 5、25 日 09:00（UTC 01:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-to-repo
  cancel-in-progress: false

env:
  TZ: Asia/Taipei

jobs:
  indicators:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安裝 Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: 更新指標
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p reports
          claude -p "$(cat prompt_indicators.md)" --allowedTools "WebSearch,WebFetch,Read,Write,Edit"

      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          if git diff --cached --quiet; then
            echo "::error::Claude 沒有產出新的報告，請看上一步的 log"
            exit 1
          fi
          git commit -m "indicators: $(date +%F)"
          git pull --rebase
          git push
